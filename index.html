<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fotogram</title>
    <link rel="icon" type="image/svg+xml" href="./assets/icons/bluete.svg?v=2">

    <link rel="stylesheet" href="./styles/style.css">
    <link rel="stylesheet" href="./styles/media-query.css">
    <link rel="stylesheet" href="./styles/fonts.css">

    <script src="./scripts/functions.js" defer></script>
    <script src="./scripts/script.js" defer></script>

</head>
<body onload="init()">
    <header class="header">
        <img src="./assets/icons/bluete.svg" alt="blüte">
        <img src="./assets/icons/fotogram.svg" alt="Fotogram">
    </header>

    <main class="main">
        <section class="photo-album">
            <h1>Your Personal photo album</h1>
            
            <div id="gallery"></div>
        </section>
        
    <dialog id="image-dialog">
    <div class="dialog-content">

        <div class="dialog-header">
            <h2 id="dialog-title"></h2>
            <button class="close-button" onclick="closeImage()" aria-label="Bild schließen">×</button>
        </div>

        <img id="dialog-image" alt="Vergrößertes Foto">

        <div class="dialog-navigation">
            <button onclick="previousImage()">←</button>
            <span id="image-counter"></span>
            <button onclick="nextImage()">→</button>
        </div>

    </div>
</dialog>

    </main>

    <footer class="footer">
        <div class="footer-logo">
            <img src="./assets/icons/bildschirm.svg" alt="bildschrim">
            <span>Developer<br>Akademie</span>
        </div>

        <p>© 2023 Developer Akademie GmbH</p>
    </footer>
</body>
</html>
